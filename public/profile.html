<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <h1>My Profile</h1>
    <div id="msg" class="alert hidden"></div>

    <div class="card">
      <h2>Details</h2>
      <form id="profile-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name">
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" disabled>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" maxlength="10">
          <div class="field-error" id="mobile-error"></div>
        </div>

        <div id="address-section">
          <h3>Address</h3>
          <div class="form-group">
            <label for="address_line">Address</label>
            <input type="text" id="address_line" maxlength="255">
            <div class="field-error" id="address_line-error"></div>
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" maxlength="100">
            <div class="field-error" id="city-error"></div>
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" maxlength="100">
            <div class="field-error" id="state-error"></div>
          </div>
          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" maxlength="6" inputmode="numeric">
            <div class="field-error" id="pincode-error"></div>
          </div>
        </div>
        <button type="submit" class="btn" id="save-btn">Save changes</button>
      </form>
    </div>

    <div class="card mt">
      <h2>Change password</h2>
      <form id="password-form" novalidate>
        <div class="form-group">
          <label for="old_password">Current password</label>
          <input type="password" id="old_password" autocomplete="current-password">
          <div class="field-error" id="old_password-error"></div>
        </div>
        <div class="form-group">
          <label for="new_password">New password (min 6 characters)</label>
          <input type="password" id="new_password" autocomplete="new-password">
          <div class="field-error" id="new_password-error"></div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm new password</label>
          <input type="password" id="confirm_password" autocomplete="new-password">
          <div class="field-error" id="confirm_password-error"></div>
        </div>
        <button type="submit" class="btn btn-warning" id="pw-btn">Change password</button>
      </form>
    </div>
  </main>
  <footer>Online Marketplace &copy; 2026</footer>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
