</head>
<body>

  <main>

      <h2>Product Not Found</h2>
      <p><a href="/products.html">← Back to Products</a></p>

    <div id="product-wrap" class="hidden">

      <div class="product-detail card mt" id="product-detail">

  <footer>
    <p>&copy; 2024 Marketplace. All rights reserved.</p>
  </footer>
