<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="form-card">
      <h2>Create account</h2>
      <div id="msg" class="alert hidden"></div>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="role">I want to</label>
          <select id="role">
            <option value="customer">Buy products (Customer)</option>
            <option value="seller">Sell products (Seller)</option>
          </select>
          <div class="text-muted" id="role-hint"></div>
          <div class="field-error" id="role-error"></div>
        </div>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name">
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email">
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" maxlength="10" autocomplete="tel">
          <div class="field-error" id="mobile-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" autocomplete="new-password">
          <div class="field-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password">
          <div class="field-error" id="confirm-error"></div>
        </div>
        <button type="submit" class="btn btn-block" id="register-btn">Register</button>
      </form>
      <p class="mt text-center">Already registered? <a href="/login.html">Login</a></p>
    </div>
  </main>
  <footer>Online Marketplace &copy; 2026</footer>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
