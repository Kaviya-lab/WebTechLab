<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Order Fulfilment</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .card { background: #fff; padding: 12px 16px; border-radius: 8px; min-width: 150px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card b { display: block; font-size: 24px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters input, .filters select, .filters button { padding: 8px; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
    th { background: #fafafa; }
    .items-row td { background: #fafbfc; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e5e7eb; }
    .badge.shipped, .badge.all_dispatched { background: #dbeafe; }
    .badge.delivered, .badge.all_delivered { background: #dcfce7; }
    .badge.cancelled, .badge.all_cancelled { background: #fee2e2; }
    .badge.partially_fulfilled, .badge.processing { background: #fef3c7; }
    .flag { color: #b45309; font-weight: bold; font-size: 12px; margin-right: 6px; }
    .pager { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    #message { color: #b91c1c; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Order Fulfilment Monitor</h1>
  <div id="message"></div>

  <div class="cards">
    <div class="card"><b id="cTotal">-</b>Total orders</div>
    <div class="card"><b id="cPartial">-</b>Partially fulfilled</div>
    <div class="card"><b id="cMixed">-</b>Cancelled + active items</div>
    <div class="card"><b id="cStale">-</b>Stale orders</div>
  </div>

  <div class="filters">
    <input id="search" placeholder="Order id, customer name or email">
    <select id="filter">
      <option value="all">All orders</option>
      <option value="partial">Partially fulfilled</option>
      <option value="cancelled_mixed">Cancelled + active items</option>
      <option value="stale">Stale (not updated)</option>
    </select>
    <select id="status">
      <option value="">Any order status</option>
      <option value="pending">pending</option>
      <option value="confirmed">confirmed</option>
      <option value="shipped">shipped</option>
      <option value="delivered">delivered</option>
      <option value="cancelled">cancelled</option>
    </select>
    <label>Stale after <input id="staleDays" type="number" min="1" max="365" value="3" style="width:60px"> days</label>
    <button id="apply">Apply</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Order</th><th>Customer</th><th>Date</th><th>Total</th>
          <th>Order status</th><th>Fulfilment</th><th>Flags</th><th></th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <div class="pager">
    <button id="prev">Previous</button>
    <span id="pageInfo"></span>
    <button id="next">Next</button>
  </div>

  <script src="js/admin-orders.js"></script>
</body>
</html>
