<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – Marketplace Seller</title>
  <meta name="description" content="Manage order fulfillment for your products." />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <div class="page-header">
      <h1>Order Fulfillment</h1>
    </div>

    <div id="msg" class="alert hidden"></div>
    <div id="loading" class="spinner"></div>

    <div id="empty" class="empty-state hidden">
      <div class="icon">📭</div>
      <h2>No orders yet</h2>
      <p class="text-muted">Orders containing your products will appear here.</p>
    </div>

    <div id="orders-list"></div>
  </main>

  <footer>
    <p>&copy; 2024 Marketplace. All rights reserved.</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/seller-orders.js"></script>
</body>
</html>
